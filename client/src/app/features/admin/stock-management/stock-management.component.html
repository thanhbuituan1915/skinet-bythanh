<div class="p-4 bg-white rounded-lg mat-elevation-z8">
    <table class="w-full text-left border-collapse">
        
        <thead>
            <tr class="bg-gray-100 border-b-2 border-gray-200">
                <th class="p-3 font-semibold text-gray-700">Id</th>
                <th class="p-3 font-semibold text-gray-700">Product Name</th>
                <th class="p-3 font-semibold text-gray-700">Price</th>
                <th class="p-3 font-semibold text-gray-700 text-center">In Stock</th>
                <th class="p-3 font-semibold text-gray-700 text-center">Actions</th>
            </tr>
        </thead>
        
        <tbody>
            <tr *ngFor="let item of products" class="border-b border-gray-100 hover:bg-gray-50">
                <td class="p-3">{{item.id}}</td>
                <td class="p-3 font-medium">{{item.name}}</td>
                <td class="p-3">{{item.price | currency}}</td>
                
                <td class="p-3 text-center">
                    <span [ngClass]="{'text-red-600 font-bold': item.quantityInStock <= 5}">
                        {{item.quantityInStock}}
                    </span>
                    
                    <span *ngIf="item.quantityInStock <= 5" 
                          class="ml-2 text-xs bg-red-100 text-red-600 px-2 py-1 rounded-full font-bold">
                        ⚠️ Low Stock
                    </span>
                </td>
                
                <td class="p-3 text-center">
                    <button (click)="exportPO(item.id, item.name)" 
                            class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md shadow-sm text-sm flex items-center justify-center mx-auto transition-colors">
                        📄 Create PO
                    </button>
                </td>
            </tr>
        </tbody>
        
    </table>

    <mat-paginator 
        class="bg-white"
        [pageSizeOptions]="[5, 10, 20]"
        [length]="totalCount"
        [pageSize]="shopParams.pageSize"
        (page)="onPageChange($event)"
        showFirstLastButtons>
    </mat-paginator>
</div>
